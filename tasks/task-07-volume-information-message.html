let taskOrder = [];
let taskStatus = {};
let currentTaskIndex = 0;
let availableParts = [];
let activeSlots = [];
let selectedSourceIdx = null;
let soundEnabled = true;
let startTime = Date.now();
let dragState = null;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
  if (!soundEnabled) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  if (type === 'success') {
    osc.frequency.value = 523.25;
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
  } else if (type === 'error') {
    osc.frequency.value = 150;
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
  } else if (type === 'click') {
    osc.frequency.value = 800;
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
  }
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  document.getElementById('sound-icon').innerHTML = soundEnabled ? 
    '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>' :
    '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>';
}

function updateThemeIcon(theme) {
  const icon = document.getElementById('theme-icon');
  if (theme === 'dark') {
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
  } else {
    icon.innerHTML = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
  }
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('inf7_theme', next);
  updateThemeIcon(next);
}

function shuffleTasks() {
  taskOrder = TASKS.map((_, i) => i);
  for (let i = taskOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [taskOrder[i], taskOrder[j]] = [taskOrder[j], taskOrder[i]];
  }
}

function loadState() {
  const savedStatus = localStorage.getItem('inf7_vpr7_status');
  const savedOrder = localStorage.getItem('inf7_vpr7_order');
  if (savedStatus) taskStatus = JSON.parse(savedStatus);
  if (savedOrder) {
    taskOrder = JSON.parse(savedOrder);
  } else {
    shuffleTasks();
  }
}

function saveState() {
  localStorage.setItem('inf7_vpr7_status', JSON.stringify(taskStatus));
  localStorage.setItem('inf7_vpr7_order', JSON.stringify(taskOrder));
}

function updateTaskSelect() {
  const select = document.getElementById('task-select');
  select.innerHTML = '';
  taskOrder.forEach((taskIdx, i) => {
    const task = TASKS[taskIdx];
    const status = taskStatus[task.id] || 'не решено';
    const shortText = task.text.split(' ').slice(0, 5).join(' ') + '...';
    const option = document.createElement('option');
    option.value = i;
    option.textContent = `№${task.id} · ${shortText} · ${status}`;
    if (i === currentTaskIndex) option.selected = true;
    select.appendChild(option);
  });
}

function loadTask(orderIdx) {
  currentTaskIndex = orderIdx;
  const task = TASKS[taskOrder[orderIdx]];
  document.getElementById('task-text').textContent = task.text;
  document.getElementById('hint-box').textContent = task.hint;
  document.getElementById('hint-box').style.display = 'none';
  document.getElementById('solve-box').style.display = 'none';
  
  const correctParts = task.parts.filter(p => p.pos !== null);
  const numSteps = correctParts.length;
  
  availableParts = [...task.parts].sort(() => Math.random() - 0.5);
  activeSlots = new Array(numSteps).fill(null);
  selectedSourceIdx = null;
  
  renderSource();
  renderTargets();
  updateTaskSelect();
  
  document.getElementById('task-counter').textContent = `${orderIdx + 1} из ${TASKS.length}`;
  const solved = Object.values(taskStatus).filter(s => s === 'correct').length;
  document.getElementById('progress-bar').style.width = `${(solved / TASKS.length) * 100}%`;
}

function renderSource() {
  const container = document.getElementById('source-container');
  container.innerHTML = '';
  availableParts.forEach((part, idx) => {
    if (activeSlots.includes(idx)) return;
    const btn = document.createElement('button');
    btn.className = 'part-btn' + (selectedSourceIdx === idx ? ' selected' : '');
    btn.textContent = part.value;
    
    btn.onpointerdown = (e) => handlePointerDown(e, idx);
    btn.onpointermove = handlePointerMove;
    btn.onpointerup = handlePointerUp;
    btn.onpointercancel = handlePointerUp;
    
    container.appendChild(btn);
  });
}

function handlePointerDown(e, idx) {
  if (activeSlots.includes(idx)) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  const el = e.currentTarget;
  el.setPointerCapture(e.pointerId);
  dragState = { 
    idx, 
    el, 
    startX: e.clientX, 
    startY: e.clientY, 
    hasMoved: false 
  };
  el.style.opacity = '0.6';
  el.style.transform = 'scale(1.02)';
}

function handlePointerMove(e) {
  if (!dragState) return;
  e.preventDefault();
  if (Math.abs(e.clientX - dragState.startX) > 5 || Math.abs(e.clientY - dragState.startY) > 5) {
    dragState.hasMoved = true;
  }
  
  document.querySelectorAll('.target-slot').forEach(s => s.classList.remove('drag-over'));
  if (dragState.hasMoved) {
    dragState.el.style.display = 'none';
    const target = document.elementFromPoint(e.clientX, e.clientY);
    dragState.el.style.display = '';
    if (target) {
      const slot = target.closest('.target-slot');
      if (slot) slot.classList.add('drag-over');
    }
  }
}

function handlePointerUp(e) {
  if (!dragState) return;
  const el = dragState.el;
  el.releasePointerCapture(e.pointerId);
  el.style.opacity = '1';
  el.style.transform = 'none';
  document.querySelectorAll('.target-slot').forEach(s => s.classList.remove('drag-over'));
  
  if (dragState.hasMoved) {
    el.style.display = 'none';
    const target = document.elementFromPoint(e.clientX, e.clientY);
    el.style.display = '';
    
    const slot = target ? target.closest('.target-slot') : null;
    if (slot) {
      const slotIdx = Array.from(slot.parentNode.children).indexOf(slot);
      placeInTarget(slotIdx, dragState.idx);
      playSound('click');
    }
  } else {
    selectSource(dragState.idx);
    playSound('click');
  }
  dragState = null;
}

function renderTargets() {
  const container = document.getElementById('target-container');
  container.innerHTML = '';
  activeSlots.forEach((slotPartIdx, slotIdx) => {
    const slot = document.createElement('div');
    slot.className = 'target-slot' + (slotPartIdx !== null ? ' filled' : '');
    if (slotPartIdx !== null) {
      slot.textContent = availableParts[slotPartIdx].value;
      slot.onclick = () => { playSound('click'); returnToSource(slotIdx); };
    } else {
      slot.textContent = `Шаг ${slotIdx + 1}`;
      slot.onclick = () => { playSound('click'); placeInTarget(slotIdx); };
    }
    container.appendChild(slot);
  });
}

function selectSource(idx) {
  selectedSourceIdx = selectedSourceIdx === idx ? null : idx;
  renderSource();
}

function placeInTarget(slotIdx, sourceIdx = selectedSourceIdx) {
  if (sourceIdx === null) return;
  activeSlots[slotIdx] = sourceIdx;
  selectedSourceIdx = null;
  renderSource();
  renderTargets();
}

function returnToSource(slotIdx) {
  activeSlots[slotIdx] = null;
  renderSource();
  renderTargets();
}

function resetSlots() {
  activeSlots = new Array(activeSlots.length).fill(null);
  selectedSourceIdx = null;
  renderSource();
  renderTargets();
}

function checkAnswer() {
  const task = TASKS[taskOrder[currentTaskIndex]];
  if (activeSlots.some(slot => slot === null)) {
    alert('Заполните все шаги!');
    return;
  }
  
  let isCorrect = true;
  for (let i = 0; i < activeSlots.length; i++) {
    const partIdx = activeSlots[i];
    const part = availableParts[partIdx];
    if (part.pos !== i + 1) {
      isCorrect = false;
      break;
    }
  }
  
  if (isCorrect) {
    playSound('success');
    taskStatus[task.id] = 'correct';
    showSolve(true);
  } else {
    playSound('error');
    taskStatus[task.id] = 'error';
    showSolve(false);
  }
  saveState();
  updateTaskSelect();
  const solved = Object.values(taskStatus).filter(s => s === 'correct').length;
  document.getElementById('progress-bar').style.width = `${(solved / TASKS.length) * 100}%`;
}

function showSolve(isCorrect) {
  const task = TASKS[taskOrder[currentTaskIndex]];
  const solveBox = document.getElementById('solve-box');
  solveBox.style.display = 'block';
  solveBox.className = isCorrect ? 'solve-box correct' : 'solve-box error';
  
  let html = `<h3>${isCorrect ? 'Верно!' : 'Есть ошибка.'} Ответ: ${task.answer}</h3>`;
  html += '<h4>Разбор:</h4><ol>';
  task.solve.forEach(step => {
    html += `<li>${step}</li>`;
  });
  html += '</ol>';
  solveBox.innerHTML = html;
}

function toggleHint() {
  const box = document.getElementById('hint-box');
  box.style.display = box.style.display === 'none' ? 'block' : 'none';
}

function prevTask() {
  if (currentTaskIndex > 0) loadTask(currentTaskIndex - 1);
}

function nextTask() {
  if (currentTaskIndex < TASKS.length - 1) loadTask(currentTaskIndex + 1);
}

function goToTask(orderIdx) {
  loadTask(orderIdx);
}

function showFinalScreen() {
  const solvedCount = Object.values(taskStatus).filter(s => s === 'correct').length;
  const errors = taskOrder.filter(i => taskStatus[TASKS[i].id] === 'error');
  const timeSpent = Math.floor((Date.now() - startTime) / 1000);
  const m = Math.floor(timeSpent / 60);
  const s = timeSpent % 60;
  
  document.getElementById('main-area').style.display = 'none';
  document.getElementById('main-actions').style.display = 'none';
  document.getElementById('bottom-nav').style.display = 'none';
  const finalArea = document.getElementById('final-area');
  finalArea.style.display = 'block';
  
  document.getElementById('final-title').textContent = `Решено ${solvedCount} из ${TASKS.length}`;
  document.getElementById('final-time').textContent = `Время: ${m} мин ${s} сек`;
  
  const errorList = document.getElementById('error-list');
  errorList.innerHTML = '';
  if (errors.length > 0) {
    errors.forEach(i => {
      const li = document.createElement('li');
      li.innerHTML = `<span>Задание №${TASKS[i].id}</span> <button class="secondary" onclick="goToTaskFromFinal(${i})" style="min-height: 56px; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 1rem;">Повторить</button>`;
      errorList.appendChild(li);
    });
  } else {
    errorList.innerHTML = '<li>Отличная работа! Ошибок нет.</li>';
  }
}

function goToTaskFromFinal(orderIdx) {
  document.getElementById('final-area').style.display = 'none';
  document.getElementById('main-area').style.display = 'flex';
  document.getElementById('main-actions').style.display = 'flex';
  document.getElementById('bottom-nav').style.display = 'flex';
  loadTask(orderIdx);
}

function newVariant() {
  if (Object.keys(taskStatus).length > 0 && !confirm('Начать новый вариант? Текущий прогресс будет сброшен.')) return;
  localStorage.removeItem('inf7_vpr7_status');
  localStorage.removeItem('inf7_vpr7_order');
  taskStatus = {};
  currentTaskIndex = 0;
  startTime = Date.now();
  shuffleTasks();
  document.getElementById('final-area').style.display = 'none';
  document.getElementById('main-area').style.display = 'flex';
  document.getElementById('main-actions').style.display = 'flex';
  document.getElementById('bottom-nav').style.display = 'flex';
  loadTask(0);
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && document.activeElement.tagName !== 'BUTTON' && document.activeElement.tagName !== 'SELECT') {
    if (document.getElementById('main-area').style.display !== 'none') {
      checkAnswer();
    }
  }
  if (e.key === 'Escape') {
    document.getElementById('hint-box').style.display = 'none';
    selectedSourceIdx = null;
    renderSource();
  }
});

if (TASKS.length === 0) {
  document.getElementById('main-area').innerHTML = '<h2>Задания не загружены. Проверьте массив TASKS.</h2>';
} else {
  loadState();
  updateThemeIcon(document.documentElement.getAttribute('data-theme') || 'light');
  loadTask(0);
}
</script>
