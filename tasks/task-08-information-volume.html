<!DOCTYPE html>
<!--
  ============================================================================
  Тренажёр «Информатика, 7 класс. Тема №8 · Количественные параметры
  информационных объектов. Информационный объём» — один файл trainer.html
  ============================================================================
  КЛАСС / ТЕМА: 7 класс, ВПР-7, задание 8 «Количественные параметры
  информационных объектов. Информационный объем» (базовый уровень, без изменений).

  МЕХАНИКА (по описанию учителя, приоритетная):
  решение каждой задачи разбито на 3 шага-окна; к верным блокам добавлены
  ДВА НЕПРАВИЛЬНЫХ блока (типичные ошибки). Блоки перетаскиваются мышью,
  пальцем, стилусом, тачпадом (Pointer Events, подсветка цели, возврат при
  промахе); альтернатива — «нажать блок → нажать окно». Когда все окна
  «Шаги» заполнены — АВТОМАТИЧЕСКАЯ проверка. Если всё верно — сверху падает
  конфетти и звучит победный звук (Web Audio API, синтез, без аудиофайлов).
  Кнопка «Проверить» и Enter оставлены для клавиатуры. Числовой ввод и
  плитки букв/цифр не используются: ответ входит в последний блок шага
  (по механике учителя), поэтому экранная клавиатура не требуется.

  ПРОВЕРЯЕМЫЕ УМЕНИЯ: мощность алфавита и вес символа N = 2^i;
  информационный объём сообщения I = K · i; перевод битов в байты и обратно
  (1 байт = 8 бит); обратная задача — число символов по объёму;
  аккуратность вычислений, в т.ч. дробные ответы в байтах.

  ИСТОЧНИКИ: https://inf7-vpr.sdamgia.ru/test?category_id=9&filter=all&print=true
  Страница открыта и прочитана; дополнительно учитель вставил полный текст
  каталога в чат. По запросу учителя в тренажёр включены ВСЕ 36 ЗАДАНИЙ
  каталога, БЕЗ ДУБЛИКАТОВ: №314–337, 446, 697, 712, 742, 780, 1106, 1186,
  1216, 1231, 1246, 1276, 1291 (в т.ч. две обратные задачи №1231 и №1276).
  Условия, числа и эталоны взяты БЕЗ ИЗМЕНЕНИЙ (включая формулировки
  «буквами»/«символами», «объем»/«объём» и приписку «Единицы измерения
  писать не нужно.» там, где она есть в источнике); уровень не менялся.
  ДОБОР НЕ ПОТРЕБОВАЛСЯ. Ссылки: https://inf7-vpr.sdamgia.ru/problem?id=…
  (приведены в разборах). Шаги решения и два неправильных блока —
  дидактическая надстройка механики учителя; сами задания не изменялись.
  Банк ФИКСИРОВАННЫЙ: генератора заданий нет; вариант = все 36 заданий в
  случайном порядке; «Новый вариант» только перемешивает те же 36 и
  сбрасывает ответы. Счётчики, список и итоги масштабируются под банк.

  ДЕДУПЛИКАЦИЯ: ключ = нормализованное условие (нижний регистр, схлопнутые
  пробелы) + все числа условия + эталон. Все 36 уникальны (проверено до
  выдачи): одинаковые ответы (45, 25, 40, 50) встречаются при разных
  условиях и числах — это разные задания, не дубликаты.
  Эталоны пересчитаны и сверены: 37,5; 40; 26,25; 100; 45; 50; 12,5; 45; 80;
  16; 60; 17,5; 50; 24; 160; 25; 6,25; 22,5; 320; 8; 30; 8,75; 25; 12; 25;
  40; 35; 36; 15; 56; 303; 500; 98; 59; 140; 55.

  РЕЖИМЫ: «Тренировка» (по умолчанию); подсказки ВКЛ (наводящая мысль, не ответ);
  разбор после ответа ВКЛ; таймер ОТКЛ (время фиксируется тихо и показывается
  только в итогах); звук ВКЛ, один переключатель в шапке выключает всё;
  прогресс — localStorage, кнопка сброса; порядок заданий случайный при каждом
  запуске файла и по кнопке «Новый вариант» (ответы хранятся по id заданий).

  ШАПКА: заголовок слева; справа кнопки в порядке «На главную» (домик,
  <a href="index.html">, та же вкладка), «Тема», «Звук» — только значки.

  ПАЛИТРА: светлая — фон #dfeafd («Голубой лёд»), акцент #0ea5e9;
  тёмная — фон #1b1440 («Индиго»), акцент #22d3ee. Поверхности и границы —
  сдвигом оттенка от фона; контраст текста ≥ 4.5:1; все цвета — CSS-переменными
  в одном месте; тема — атрибутом data-theme на <html>, без мигания при загрузке.
  ============================================================================
-->
<html lang="ru" data-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тренажёр · Информатика 7 · №8 · Информационный объём</title>
  <script>
    (function () {
      var t = "light";
      try {
        t = localStorage.getItem("inf7t8.theme");
        if (t !== "light" && t !== "dark") { t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
      } catch (e) { t = "light"; }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <style>
    /* ===== Все цвета темы — здесь, в одном месте ===== */
    :root,
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #dfeafd;
      /* Голубой лёд */
      --surface: #edf4fe;
      --surface-2: #d3e2f8;
      --slot: #f6faff;
      --border: #a9c2e4;
      --text: #16283f;
      --muted: #40587c;
      --accent: #0ea5e9;
      --accent-ink: #052436;
      --accent-soft: #c3e7fb;
      --ok: #166534;
      --ok-soft: #d7f3e0;
      --err: #b91c1c;
      --err-soft: #fbe0e0;
      --focus: #075985;
      --shadow: 0 10px 28px rgba(22, 40, 63, .14);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #1b1440;
      /* Индиго */
      --surface: #251d54;
      --surface-2: #302768;
      --slot: #2b2260;
      --border: #4c3f92;
      --text: #f0edff;
      --muted: #beb5ea;
      --accent: #22d3ee;
      --accent-ink: #05262e;
      --accent-soft: #113f52;
      --ok: #57e389;
      --ok-soft: #11331f;
      --err: #ff8f8f;
      --err-soft: #47202a;
      --focus: #7dd3fc;
      --shadow: 0 10px 28px rgba(0, 0, 0, .45);
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 20px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "PT Sans", Arial, sans-serif;
      overflow-x: clip;
    }

    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
      border-radius: 10px
    }

    .app {
      max-width: 1120px;
      margin: 0 auto;
      padding: 16px 16px 48px
    }

    /* ===== Шапка: заголовок слева, справа кнопки «На главную», «Тема», «Звук» ===== */
    .top {
      position: sticky;
      top: 0;
      z-index: 70;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 2px solid var(--border);
    }

    .titles {
      flex: 1;
      min-width: 0
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 2.6vw, 28px);
      line-height: 1.2
    }

    .sub {
      margin: 0;
      font-size: 20px;
      color: var(--muted);
      overflow-wrap: anywhere
    }

    .icon-btn {
      width: 52px;
      height: 52px;
      flex: none;
      display: grid;
      place-items: center;
      background: var(--surface-2);
      border: 2px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      cursor: pointer;
      padding: 0;
    }

    .icon-btn svg {
      width: 26px;
      height: 26px;
      display: block
    }

    a.icon-btn {
      text-decoration: none
    }

    /* ===== Панель навигации ===== */
    .panel {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin: 14px 0
    }

    select {
      flex: 1 1 340px;
      max-width: 100%;
      min-height: 56px;
      font-size: 20px;
      font-family: inherit;
      color: var(--text);
      background: var(--surface-2);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 10px 14px;
      cursor: pointer;
    }

    .chip {
      background: var(--accent-soft);
      border: 2px solid var(--border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 20px;
      font-weight: 700;
      white-space: nowrap;
    }

    .chip.mode {
      background: var(--surface-2);
      color: var(--muted);
      font-weight: 600
    }

    .progress {
      flex: 1 1 100%;
      display: flex;
      align-items: center;
      gap: 10px
    }

    .track {
      flex: 1;
      height: 16px;
      background: var(--surface-2);
      border: 2px solid var(--border);
      border-radius: 999px;
      overflow: hidden
    }

    .fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width .35s
    }

    .ptext {
      font-size: 20px;
      color: var(--muted);
      white-space: nowrap
    }

    /* ===== Кнопки ===== */
    .btn {
      min-height: 56px;
      min-width: 56px;
      padding: 10px 18px;
      border-radius: 14px;
      cursor: pointer;
      border: 2px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font: 600 20px/1.3 inherit;
      font-family: inherit;
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
      font-weight: 800
    }

    .btn:disabled {
      opacity: .55;
      cursor: default
    }

    .btn.warn {
      border-color: var(--err);
      color: var(--err)
    }

    /* ===== Карточка задания ===== */
    .card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .task-head {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px
    }

    .task-head h2 {
      margin: 0;
      font-size: 24px
    }

    .cond {
      font-size: 22px;
      line-height: 1.55;
      overflow-wrap: anywhere
    }

    .cond p {
      margin: 8px 0
    }

    .hint-row {
      margin: 12px 0 0
    }

    .hint-box {
      margin-top: 10px;
      background: var(--accent-soft);
      border: 2px dashed var(--accent);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 20px;
    }

    .board-note {
      font-size: 20px;
      color: var(--muted);
      margin: 14px 0 10px
    }

    .board {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 14px
    }

    .col-title {
      margin: 0 0 8px;
      font-size: 20px;
      color: var(--muted)
    }

    .slots,
    .pool {
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .slot {
      min-height: 78px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: var(--slot);
      border: 3px dashed var(--border);
      border-radius: 14px;
      cursor: pointer;
    }

    .slot-num {
      width: 40px;
      height: 40px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--accent-soft);
      border: 2px solid var(--border);
      font-weight: 800;
      font-size: 20px;
    }

    .slot-body {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center
    }

    .ph {
      color: var(--muted);
      font-size: 20px
    }

    .slot.filled {
      border-style: solid
    }

    .slot.over {
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: 0 0 0 4px var(--accent-soft)
    }

    .slot.good {
      border-color: var(--ok);
      border-style: solid;
      background: var(--ok-soft)
    }

    .slot.bad {
      border-color: var(--err);
      border-style: solid;
      background: var(--err-soft);
      animation: shake .45s
    }

    .block {
      min-height: 56px;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 20px;
      line-height: 1.4;
      background: var(--surface-2);
      border: 2px solid var(--border);
      color: var(--text);
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      overflow-wrap: anywhere;
    }

    .slot .block {
      flex: 1
    }

    .block.sel {
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: 0 0 0 4px var(--accent-soft)
    }

    .block.drag-src {
      opacity: .35
    }

    .block.locked {
      cursor: default
    }

    .ghost {
      position: fixed;
      z-index: 300;
      pointer-events: none;
      margin: 0;
      opacity: .97;
      transform: rotate(1.5deg);
      box-shadow: var(--shadow);
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0)
      }

      20% {
        transform: translateX(-6px)
      }

      40% {
        transform: translateX(6px)
      }

      60% {
        transform: translateX(-4px)
      }

      80% {
        transform: translateX(4px)
      }
    }

    .feedback {
      margin-top: 14px;
      min-height: 56px;
      display: flex;
      align-items: center;
      padding: 12px 14px;
      border-radius: 14px;
      border: 2px solid var(--border);
      font-size: 22px;
      font-weight: 700;
    }

    .feedback.neutral {
      background: var(--surface-2);
      font-weight: 600
    }

    .feedback.ok {
      background: var(--ok-soft);
      color: var(--ok);
      border-color: var(--ok)
    }

    .feedback.err {
      background: var(--err-soft);
      color: var(--err);
      border-color: var(--err)
    }

    .explain {
      margin-top: 12px;
      background: var(--surface-2);
      border: 2px solid var(--border);
      border-left: 8px solid var(--accent);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 20px;
    }

    .explain ol {
      margin: 8px 0;
      padding-left: 30px
    }

    .explain li {
      margin: 6px 0
    }

    .explain .trap {
      color: var(--muted)
    }

    .explain .src {
      margin: 8px 0 0
    }

    .explain a {
      color: var(--focus)
    }

    /* ===== Нижняя панель действий ===== */
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 16px
    }

    .actions .btn {
      flex: 1
    }

    /* ===== Итоги ===== */
    .score {
      font-size: clamp(36px, 6vw, 56px);
      font-weight: 800;
      margin: 0
    }

    .sum-time {
      font-size: 22px;
      color: var(--muted);
      margin: 6px 0 14px
    }

    .err-item {
      background: var(--surface-2);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-top: 12px
    }

    .err-item h3 {
      margin: 0 0 8px;
      font-size: 22px
    }

    .sum-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px
    }

    .sum-actions .btn {
      flex: 1 1 220px
    }

    .praise {
      font-size: 24px;
      font-weight: 800;
      color: var(--ok);
      background: var(--ok-soft);
      border: 2px solid var(--ok);
      border-radius: 14px;
      padding: 14px
    }

    #fx {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 400;
      display: none
    }

    [hidden] {
      display: none !important
    }

    /* ===== Адаптив ===== */
    @media (max-width:860px) {
      .board {
        grid-template-columns: 1fr
      }
    }

    @media (max-width:800px) {
      .app {
        padding-bottom: 140px
      }

      .actions {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        margin: 0;
        z-index: 80;
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
        background: var(--surface);
        border-top: 2px solid var(--border);
        box-shadow: 0 -6px 20px rgba(0, 0, 0, .18);
      }

      .actions .btn {
        padding: 10px 8px
      }

      .panel .btn {
        flex: 1 1 160px
      }
    }

    @media (prefers-reduced-motion:reduce) {
      html {
        scroll-behavior: auto
      }

      .fill {
        transition: none
      }

      .slot.bad {
        animation: none
      }
    }
  </style>
</head>

<body>
  <header class="top">
    <div class="titles">
      <h1>Информационный объём · 7 класс</h1>
      <p class="sub">Тема №8 · Количественные параметры информационных объектов</p>
    </div>
    <a class="icon-btn" href="../index.html" aria-label="На главную" title="На главную">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <path d="M3 11.5 12 4l9 7.5" />
        <path d="M5.5 10.5V20h13v-9.5" />
        <path d="M10 20v-5h4v5" />
      </svg>
    </a>
    <button type="button" class="icon-btn" id="themeBtn" aria-label="Переключить тему" title="Тема">
      <svg id="icoSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
        aria-hidden="true" hidden>
        <circle cx="12" cy="12" r="4.5" />
        <path
          d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M19.4 4.6l-1.8 1.8M6.4 17.6l-1.8 1.8" />
      </svg>
      <svg id="icoMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" />
      </svg>
    </button>
    <button type="button" class="icon-btn" id="sndBtn" aria-label="Выключить звук" aria-pressed="true" title="Звук">
      <svg id="sndOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9H4z" />
        <path d="M16.5 8.5a5 5 0 0 1 0 7" />
        <path d="M19 6a8.5 8.5 0 0 1 0 12" />
      </svg>
      <svg id="sndOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true" hidden>
        <path d="M4 9v6h4l5 4V5L8 9H4z" />
        <path d="m16 9 6 6" />
        <path d="m22 9-6 6" />
      </svg>
    </button>
  </header>

  <div class="app">
    <div class="panel" id="toolbar">
      <select id="taskSelect" aria-label="Список заданий"></select>
      <span class="chip" id="counter">1 из 36</span>
      <span class="chip mode">Тренировка</span>
      <button type="button" class="btn" id="sumBtn">Итоги</button>
      <button type="button" class="btn" id="newBtn">Новый вариант</button>
      <button type="button" class="btn warn" id="resetBtn">Сброс</button>
      <div class="progress">
        <div class="track" id="track" role="progressbar" aria-label="Решено заданий" aria-valuemin="0"
          aria-valuemax="36" aria-valuenow="0">
          <div class="fill" id="fill"></div>
        </div>
        <span class="ptext" id="ptext">Решено: 0 из 36</span>
      </div>

        e.preventDefault();
        const bid = el.dataset.bid;
        const sx = e.clientX, sy = e.clientY, pid = e.pointerId;
        let moved = false, ghost = null, ox = 0, oy = 0, over = null;
        try { el.setPointerCapture(pid); } catch (err) { }
        const clearOver = () => { if (over) { over.classList.remove("over"); over = null; } };
        const makeGhost = () => {
          const r = el.getBoundingClientRect();
          ghost = el.cloneNode(true);
          ghost.classList.add("ghost"); ghost.classList.remove("sel");
          ghost.style.width = r.width + "px"; ghost.style.left = r.left + "px"; ghost.style.top = r.top + "px";
          ghost.removeAttribute("tabindex"); ghost.setAttribute("aria-hidden", "true");
          document.body.appendChild(ghost); activeGhost = ghost;
          ox = sx - r.left; oy = sy - r.top;
          el.classList.add("drag-src");
        };
        const dropTarget = (x, y) => {
          const u = document.elementFromPoint(x, y);
          return u ? u.closest("#slots .slot") : null;
        };
        const overPool = (x, y) => {
          const u = document.elementFromPoint(x, y);
          return u ? u.closest("#pool") : null;
        };
        const cleanup = () => {
          el.removeEventListener("pointermove", onMove);
          el.removeEventListener("pointerup", onUp);
          el.removeEventListener("pointercancel", onCancel);
          clearOver();
        };
        const ghostBack = () => {
          if (!ghost) { el.classList.remove("drag-src"); return; }
          const r = el.getBoundingClientRect(), g = ghost;
          g.style.transition = "left .18s ease, top .18s ease";
          g.style.left = r.left + "px"; g.style.top = r.top + "px";
          setTimeout(() => { g.remove(); if (activeGhost === g) activeGhost = null; el.classList.remove("drag-src"); }, 190);
          ghost = null;
        };
        const onMove = ev => {
          if (ev.pointerId !== pid) return;
          if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 7) { moved = true; makeGhost(); }
          if (moved && ghost) {
            ghost.style.left = (ev.clientX - ox) + "px"; ghost.style.top = (ev.clientY - oy) + "px";
            const t = dropTarget(ev.clientX, ev.clientY);
            if (t !== over) { clearOver(); if (t && !locked()) { over = t; over.classList.add("over"); } }
          }
        };
        const onUp = ev => {
          if (ev.pointerId !== pid) return;
          cleanup();
          if (!moved) { blockActivate(el); return; }
          const t = dropTarget(ev.clientX, ev.clientY);
          const p = overPool(ev.clientX, ev.clientY);
          const inSlot = getRes().placed.includes(bid);
          if (t && !locked()) {
            if (ghost) { ghost.remove(); if (activeGhost === ghost) activeGhost = null; ghost = null; }
            el.classList.remove("drag-src");
            place(bid, Number(t.dataset.slot));
          } else if (p && inSlot) {
            if (ghost) { ghost.remove(); if (activeGhost === ghost) activeGhost = null; ghost = null; }
            el.classList.remove("drag-src");
            toPool(bid);
          } else {
            ghostBack(); /* возврат при промахе */
          }
        };
        const onCancel = ev => {
          if (ev.pointerId !== pid) return;
          cleanup();
          if (ghost) { ghost.remove(); if (activeGhost === ghost) activeGhost = null; ghost = null; }
          el.classList.remove("drag-src");
        };
        el.addEventListener("pointermove", onMove);
        el.addEventListener("pointerup", onUp);
        el.addEventListener("pointercancel", onCancel);
      });
    }
    function lockBoard() {
      clearSel();
      document.querySelectorAll("#slots .slot").forEach(s => { s.classList.add("good"); s.setAttribute("aria-disabled", "true"); });
      document.querySelectorAll("#taskCard .block").forEach(b => { b.classList.add("locked"); b.setAttribute("aria-disabled", "true"); });
    }

    /* ================= Проверка ================= */
    function doCheck(auto) {
      const r = getRes(), t = curTask();
      if (r.status === "ok") return;
      if (!allFilled()) {
        if (!auto) setFeedback("neutral", "Сначала заполните все окна «Шаги»: перетащите блоки или нажмите блок, затем окно.");
        return;
      }
      markStart(); clearTimeout(retT);
      r.checked = true;
      const ok = r.placed.every((b, i) => b === "s" + i);
      if (ok) {
        r.status = "ok";
        lockBoard();
        setFeedback("ok", `Верно! Ответ: ${t.ans}.`);
        showExplain(); sndWin(); confetti(160);
      } else {
        r.status = "err"; r.errors++;
        setFeedback("err", "Пока неверно. Лишние и перепутанные блоки вернутся в набор — попробуйте ещё раз.");
        showExplain(); sndErr();
        r.placed.forEach((b, k) => {
          const s = slotEl(k); if (!s) return;
          if (b === "s" + k) { s.classList.add("good"); s.classList.remove("bad"); }
          else { s.classList.add("bad"); s.classList.remove("good"); }
        });
        retT = setTimeout(() => {
          const rr = getRes();
          rr.placed.forEach((b, k) => {
            if (b && b !== "s" + k) { toPool(b); const s = slotEl(k); if (s) s.classList.remove("bad"); }
          });
        }, 900);
      }
      syncSelect(); syncProgress(); updateCheckBtn(); save();
    }

    /* ================= Рендер задания ================= */
    function renderTask() {
      clearTimers(); killGhost(); clearSel();
      const t = curTask(), r = getRes();
      syncSelect(); syncProgress(); syncNav();
      const card = $("#taskCard");
      card.innerHTML =
        `<div class="task-head"><span class="chip">Задание ${state.cur + 1}</span><h2>${t.short}</h2></div>` +
        `<div class="cond"><p>${t.cond}</p></div>` +
        `<div class="hint-row"><button type="button" class="btn" id="hintBtn" aria-expanded="false" aria-controls="hintBox">💡 Подсказка</button></div>` +
        `<div id="hintBox" class="hint-box" hidden>${t.hint}</div>` +
        `<p class="board-note">Соберите решение: перетащите блоки в окна «Шаги» мышью, пальцем или стилусом. Можно иначе: нажмите блок → нажмите окно. Лишних блоков — 2. Проверка выполнится автоматически, когда все окна заполнены.</p>` +
        `<div class="board"><div class="col"><h3 class="col-title">Шаги решения</h3><div class="slots" id="slots"></div></div>` +
        `<div class="col"><h3 class="col-title">Блоки · 2 лишних</h3><div class="pool" id="pool"></div></div></div>` +
        `<div id="feedback" class="feedback neutral" role="status" aria-live="polite"></div>` +
        `<div id="explain" class="explain" hidden></div>`;
      const slots = $("#slots");
      t.steps.forEach((_, k) => {
        const s = document.createElement("div");
        s.className = "slot"; s.dataset.slot = k; s.tabIndex = 0; s.setAttribute("role", "button");
        s.innerHTML = `<span class="slot-num" aria-hidden="true">${k + 1}</span><div class="slot-body"><span class="ph">Перетащите блок сюда</span></div>`;
        s.addEventListener("click", onSlotClick);
        s.addEventListener("keydown", onSlotKey);
        slots.appendChild(s);
      });
      const pool = $("#pool"), blocks = blocksFor(t);
      r.border.forEach(idx => {
        const b = blocks[idx];
        const el = document.createElement("div");
        el.className = "block"; el.dataset.bid = b.bid; el.dataset.idx = idx;
        el.tabIndex = 0; el.setAttribute("role", "button"); el.setAttribute("aria-pressed", "false");
        el.textContent = b.text;
        attachBlock(el); pool.appendChild(el);
      });
      r.placed.forEach((bid, k) => {
        if (bid) { const el = findBlock(bid); if (el) fillSlot(k, el); }
      });
      t.steps.forEach((_, k) => slotAria(k));
      if (r.status === "ok") {
        lockBoard(); setFeedback("ok", `Верно! Ответ: ${t.ans}.`); showExplain();
      } else if (r.checked) {
        setFeedback("err", "Есть ошибка. Изучите разбор и соберите решение ещё раз."); showExplain();
      } else {
        setFeedback("neutral", "Заполните все три окна — проверка выполнится автоматически.");
      }
      $("#hintBtn").addEventListener("click", toggleHint);
      updateCheckBtn();
    }
    function toggleHint() {
      const box = $("#hintBox"), btn = $("#hintBtn");
      const open = box.hidden;
      box.hidden = !open; btn.setAttribute("aria-expanded", String(open));
    }
    function closeHint() {
      const box = $("#hintBox"), btn = $("#hintBtn");
      if (box && !box.hidden) { box.hidden = true; btn.setAttribute("aria-expanded", "false"); }
    }
    function openTask(i) {
      state.cur = Math.max(0, Math.min(TOTAL - 1, i)); save();
      $("#summary").hidden = true; $("#taskView").hidden = false; $("#toolbar").hidden = false;
      renderTask();
      window.scrollTo(0, 0);
    }

    /* ================= Итоги ================= */
    function fmtTime(ms) {
      const s = Math.max(0, Math.round(ms / 1000));
      return `${Math.floor(s / 60)} мин ${s % 60} с`;
    }
    function openSummary() {
      clearTimers(); killGhost();
      $("#taskView").hidden = true; $("#toolbar").hidden = true; $("#summary").hidden = false;
      const n = okCount();
      const elapsed = state.started ? Date.now() - state.started : 0;
      let html = `<h2 style="margin:0 0 6px;font-size:26px">Итоги варианта</h2>` +
        `<p class="score">${n} из ${TOTAL}</p><p class="sum-time">Затраченное время: ${fmtTime(elapsed)}</p>`;
      if (n === TOTAL && state.order.every(id => state.res[id].errors === 0)) {
        html += `<p class="praise">Все задания решены верно с первой попытки! Отличная работа! 🎉</p>`;
      } else if (n === TOTAL) {
        html += `<p class="praise">Все задания решены верно! 🎉</p>`;
      }
      const errIds = state.order.map((id, i) => ({ id, i })).filter(x => state.res[x.id].errors > 0 || state.res[x.id].status === "err");
      if (errIds.length) {
        html += `<h3 style="font-size:22px;margin:16px 0 0">Ошибки и разбор</h3>`;
        errIds.forEach(x => {
          const t = MAP[x.id], r = state.res[x.id];
          html += `<div class="err-item"><h3>№${x.i + 1} · ${t.short} · ${statusText(r.status)}</h3>` +
            `<p style="margin:6px 0">${t.cond}</p>${explainHTML(t)}` +
            `<button type="button" class="btn" data-jump="${x.i}">К заданию №${x.i + 1}</button></div>`;
        });
      }
      const noneIds = state.order.map((id, i) => ({ id, i })).filter(x => state.res[x.id].status === "none");
      if (noneIds.length) {
        html += `<h3 style="font-size:22px;margin:16px 0 8px">Не решено</h3><div class="sum-actions" style="margin-top:0">`;
        noneIds.forEach(x => { html += `<button type="button" class="btn" data-jump="${x.i}">№${x.i + 1} · ${MAP[x.id].short}</button>`; });
        html += `</div>`;
      }
      html += `<div class="sum-actions"><button type="button" class="btn primary" id="newBtn2">Новый вариант</button>` +
        `<button type="button" class="btn" id="backBtn">Вернуться к заданиям</button></div>`;
      $("#summary").innerHTML = html;
      if (n === TOTAL) { sndWin(); confetti(240); } else { sndEnd(); }
      window.scrollTo(0, 0);
    }

    /* ================= Новый вариант / сброс ================= */
    function newVariant() {
      clearTimers(); killGhost();
      state.order = shuffle(IDS); /* те же 36 заданий, новый порядок; новых не генерируем */
      state.res = {}; IDS.forEach(id => { state.res[id] = freshRes(); });
      state.started = 0; state.cur = 0; save();
      buildSelect(); openTask(0);
    }
    function resetProgress() {
      clearTimers(); killGhost();
      state.res = {}; IDS.forEach(id => { state.res[id] = freshRes(); });
      state.started = 0; state.cur = 0; save();
      buildSelect(); openTask(0);
    }
    function armReset() {
      const b = $("#resetBtn");
      if (resetArm) {
        clearTimeout(resetArm); resetArm = 0;
        b.textContent = "Сброс";
        resetProgress();
        setFeedback("neutral", "Прогресс сброшен. Порядок заданий сохранён.");
        return;
      }
      b.textContent = "Точно сбросить? Нажмите ещё раз"; b.classList.add("warn");
      resetArm = setTimeout(() => { resetArm = 0; b.textContent = "Сброс"; }, 3500);
    }

    /* ================= Тема и звук ================= */
    function syncThemeBtn() {
      const dark = document.documentElement.getAttribute("data-theme") === "dark";
      $("#icoSun").hidden = !dark; $("#icoMoon").hidden = dark;
      $("#themeBtn").setAttribute("aria-label", dark ? "Включить светлую тему" : "Включить тёмную тему");
      $("#themeBtn").title = dark ? "Светлая тема" : "Тёмная тема";
    }
    function toggleTheme() {
      const cur = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
      const next = cur === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("inf7t8.theme", next); } catch (e) { }
      syncThemeBtn();
    }
    function syncSndBtn() {
      $("#sndOn").hidden = !soundOn; $("#sndOff").hidden = soundOn;
      $("#sndBtn").setAttribute("aria-pressed", String(soundOn));
      $("#sndBtn").setAttribute("aria-label", soundOn ? "Выключить звук" : "Включить звук");
      $("#sndBtn").title = soundOn ? "Звук включён" : "Звук выключен";
    }
    function toggleSound() {
      soundOn = !soundOn;
      try { localStorage.setItem("inf7t8.sound", soundOn ? "1" : "0"); } catch (e) { }
      syncSndBtn();
      if (soundOn) tone(659.25, 0, 0.15, "sine", 0.15);
    }

    /* ================= Глобальные обработчики (один раз) ================= */
    $("#themeBtn").addEventListener("click", toggleTheme);
    $("#sndBtn").addEventListener("click", toggleSound);
    $("#taskSelect").addEventListener("change", e => openTask(Number(e.target.value)));
    $("#prevBtn").addEventListener("click", () => openTask(state.cur - 1));
    $("#nextBtn").addEventListener("click", () => { if (state.cur === TOTAL - 1) openSummary(); else openTask(state.cur + 1); });
    $("#checkBtn").addEventListener("click", () => doCheck(false));
    $("#newBtn").addEventListener("click", newVariant);
    $("#resetBtn").addEventListener("click", armReset);
    $("#sumBtn").addEventListener("click", openSummary);
    $("#summary").addEventListener("click", e => {
      const j = e.target.closest("[data-jump]");
      if (j) { openTask(Number(j.dataset.jump)); return; }
      if (e.target.closest("#newBtn2")) { newVariant(); return; }
      if (e.target.closest("#backBtn")) { openTask(state.cur); }
    });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") { closeHint(); clearSel(); return; }
      if (e.key === "Enter") {
        const t = e.target;
        if (t && t.closest && t.closest("select,a,button,input,textarea,[role='button'],summary")) return;
        if (!$("#taskView").hidden) { e.preventDefault(); doCheck(false); }
      }
    });
    document.addEventListener("focusin", e => {
      const t = e.target;
      if (t && t.matches && t.matches("input,select,textarea")) {
        setTimeout(() => { try { t.scrollIntoView({ block: "center", behavior: "smooth" }); } catch (err) { } }, 250);
      }
    });

    /* ================= Старт ================= */
    loadState();
    buildSelect();
    syncThemeBtn();
    syncSndBtn();
    renderTask();
  </script>
</body>
